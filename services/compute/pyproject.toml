[project]
name = "trainfabric-compute"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "app/tf_cli/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
