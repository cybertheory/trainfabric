name = "trainfabric-router"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
account_id = "e5793b12d9dd58ea18bde1fbbed5262b"

[vars]
STREAM_SIZE_THRESHOLD_BYTES = "52428800"
MAX_RESULT_ROWS = "10000000"
ENABLE_BRANCHING = "false"
CASE_A_MODE = "manifest"
WARM_HOT_THRESHOLD = "20"
WARM_IDLE_TIMEOUT_MS = "600000"
CATALOG_BACKEND = "rest"
ICEBERG_WAREHOUSE = "s3://trainfabric-data/__r2_data_catalog"
R2_BUCKET = "trainfabric-data"
R2_REGION = "auto"
R2_ENDPOINT = "https://e5793b12d9dd58ea18bde1fbbed5262b.r2.cloudflarestorage.com"
ICEBERG_REST_URI = "https://catalog.cloudflarestorage.com/e5793b12d9dd58ea18bde1fbbed5262b/trainfabric-data"
ICEBERG_WAREHOUSE_ID = "e5793b12d9dd58ea18bde1fbbed5262b_trainfabric-data"
CF_ACCOUNT_ID = "e5793b12d9dd58ea18bde1fbbed5262b"
CF_AI_GATEWAY_ID = "default"
CF_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Clerk Frontend API issuer (session JWT iss). Audience left unset for default session tokens.
CLERK_JWT_ISSUER = "https://desired-seal-5.clerk.accounts.dev"
PUBLIC_API_BASE = "https://trainfabric-router.rishabhspro.workers.dev"
DASHBOARD_URL = "https://dashboard-opal-tau-54.vercel.app"
# Secrets: CF_AI_GATEWAY_TOKEN, AGENT_TOKEN_SECRET, BOX_API_KEY, MODAL_TOKEN,
#   GITHUB_APP_ID, GITHUB_APP_SLUG, GITHUB_APP_CLIENT_ID, GITHUB_APP_CLIENT_SECRET,
#   GITHUB_APP_PRIVATE_KEY, GITHUB_APP_WEBHOOK_SECRET, GITHUB_APP_STATE_SECRET,
#   GITHUB_TOKEN_CRYPTO_KEY, HF_OAUTH_CLIENT_ID, HF_OAUTH_CLIENT_SECRET
#   (wrangler secret put)

[[r2_buckets]]
binding = "R2"
bucket_name = "trainfabric-data"
preview_bucket_name = "trainfabric-data"

[[d1_databases]]
binding = "DB"
database_name = "trainfabric-registry"
database_id = "3c61f216-8adf-46b5-a82f-346cc51407cc"

[[vectorize]]
binding = "VECTORIZE"
index_name = "dataset-embeddings"

[ai]
binding = "AI"

[[containers]]
class_name = "ComputeContainer"
image = "../compute/Dockerfile"
max_instances = 2

[durable_objects]
bindings = [
  { name = "CATALOG_DO", class_name = "CatalogDO" },
  { name = "WARM_ROUTER_DO", class_name = "WarmRouterDO" },
  { name = "COMPUTE", class_name = "ComputeContainer" },
  { name = "TRAINFABRIC_AGENT_DO", class_name = "TrainfabricAgentDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["CatalogDO", "WarmRouterDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ComputeContainer"]

[[migrations]]
tag = "v3"
new_classes = ["TrainfabricAgentDO"]

# Dashboard UI is hosted on Vercel (dynamic Next.js).
# This Worker is API-only.
